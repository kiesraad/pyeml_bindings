[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeml_bindings"
description = "Data bindings for the EML_NL Standard"
version = "1.3.0"
authors = [{name = "Chris Mostert", email = "chris.mostert@kiesraad.nl"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xsdata == 26.*"
]
license = "EUPL-1.2"
license-files = ["LICEN[CS]E"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-xdist",
  "formencode"
]

[project.urls]
Home = "https://github.com/kiesraad/pyeml_bindings"
Issues = "https://github.com/kiesraad/pyeml_bindings/issues"
